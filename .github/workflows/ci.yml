name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal scripts tests)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 -timeout 900s ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: npm audit (informational)
        run: npm audit --audit-level=critical
        continue-on-error: true
